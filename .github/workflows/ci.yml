# ============================================================
# .github/workflows/ci.yml
# GitHub Actions CI/CD pipeline for Mini CRM de Clientes.
#
# Triggers on every push and pull request.
# Steps:
#   1. Checkout code
#   2. Set up Python 3.12
#   3. Install project dependencies
#   4. Run Django system checks (python manage.py check)
#   5. Build the Docker image
# ============================================================

name: CI — Mini CRM

on:
  push:
    branches: ["**"]   # All branches
  pull_request:
    branches: ["**"]

jobs:
  build-and-check:
    name: Django Check + Docker Build
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout source code ──────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ─────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"           # Cache pip downloads for faster runs

      # ── Step 3: Install Python dependencies ───────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Django system check & tests ───────────────
      # Validates models, URLs, settings, middleware and runs unit tests
      - name: Run Django system checks
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: crm_project.settings
          SECRET_KEY: ci-test-secret-key-32-chars-long
          DEBUG: "True"

      - name: Run Django test suite
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: crm_project.settings
          SECRET_KEY: ci-test-secret-key-32-chars-long
          DEBUG: "True"

      # ── Step 5: Build Docker image ────────────────────────
      # Validates the Dockerfile by building the image locally.
      # The image is NOT pushed to any registry in this workflow.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false          # Build only — no registry push
          tags: mini-crm:ci
